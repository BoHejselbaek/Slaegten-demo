<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Origin-test</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;padding:24px;background:#111;color:#eee;
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h1{font-size:1.25rem;font-weight:600;margin:0 0 20px}
  dl{margin:0}
  dt{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-top:18px}
  dd{margin:4px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
     font-size:.9rem;word-break:break-all}
  .ok{color:#6ee7a0}
  .no{color:#f8a0a0}
  p.note{margin-top:28px;color:#888;font-size:.85rem}
</style>
</head>
<body>
<h1>Origin-test</h1>
<dl>
  <dt>Origin</dt><dd id="o">–</dd>
  <dt>Nøgler i localStorage</dt><dd id="k">–</dd>
  <dt>Kan skrive til localStorage</dt><dd id="w">–</dd>
</dl>
<p class="note">Midlertidig testside. Ingen data, ingen slægt.</p>
<script>
(function(){
  document.getElementById('o').textContent = location.origin;
  var k = document.getElementById('k'), w = document.getElementById('w');
  try{
    var n = localStorage.length, names = [];
    for(var i=0;i<n;i++) names.push(localStorage.key(i));
    k.textContent = n === 0 ? '0 — tom (ingen deling)' : n + ': ' + names.join(', ');
    k.className = n === 0 ? 'ok' : 'no';
    localStorage.setItem('__probe','1');
    localStorage.removeItem('__probe');
    w.textContent = 'ja';
    w.className = 'ok';
  }catch(e){
    w.textContent = 'nej — ' + e.name;
    w.className = 'no';
  }
})();
</script>
</body>
</html>
